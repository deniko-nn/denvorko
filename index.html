<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070f">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="%BASE_URL%assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="%BASE_URL%assets/img/apple-touch-icon.png">
<link rel="manifest" href="%BASE_URL%site.webmanifest">
<script>(function(){var r=document.documentElement;r.classList.add('js');try{var off=localStorage.getItem('motion')==='off';if(off)r.classList.add('motion-off');if(!off&&!sessionStorage.getItem('intro')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)r.classList.add('intro-pending')}catch(e){}})();</script>
</head>

<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
